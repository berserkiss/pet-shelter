# HTTP и HTTPS (одинаковая логика прокси)
server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name pawfinds.com localhost;

  ssl_certificate     /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols         TLSv1.2 TLSv1.3;

  # Frontend (React в контейнере client)
  location / {
    proxy_pass http://client:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OTP: на Express маршруты вида /api/verifyotp (OtpRouter на app.use('/api', …))
  # Общий /api/ ниже режет префикс — для этих трёх путей его сохраняем
  location = /api/genotp {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/verifyotp {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/forgototp {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AI-эндпоинты (regenerate, ai-assistant, analytics): Gemini может отвечать >60s
  # Regex-локейшн имеет приоритет над /api/, но /api/ режет префикс через proxy_pass /;
  # здесь нужно сделать то же самое — rewrite strips /api/
  location ~ ^/api/(pet-care/calendar/.+/(?:regenerate|ai-assistant|analytics))$ {
    proxy_pass http://server:4000/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Остальной API: /api/user/... → /user/..., /api/pets/... → /pets/...
  location /api/ {
    proxy_pass http://server:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO
  location /socket.io/ {
    proxy_pass http://server:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
